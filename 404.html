<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Need for Speed Most Wanted - Rockport World Records</title>
  <script>
    // Single Page Apps for GitHub Pages & Custom Domain SPA Router
    // https://github.com/rafgraph/spa-github-pages
    var pathSegmentsToKeep = 0;
    var l = window.location;
    if (l.hostname.indexOf('github.io') !== -1) {
      var segs = l.pathname.split('/').filter(Boolean);
      if (segs.length > 0) {
        pathSegmentsToKeep = 1;
      }
    }
    var repoPrefix = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
    if (!repoPrefix.endsWith('/')) repoPrefix += '/';
    var routePath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
    var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      repoPrefix + '?/' + routePath.replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash;
    l.replace(targetUrl);
  </script>
</head>
<body style="background: #07070a; color: #ffb800; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <h2 style="letter-spacing: 0.1em; text-transform: uppercase;">CARGANDO SESIÓN ROCKPORT 2026...</h2>
    <p style="color: #94a3b8; font-size: 13px;">Sincronizando dirección personalizada con telemetría...</p>
  </div>
</body>
</html>
